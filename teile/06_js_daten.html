function geraeteKennung(){
  let k = null;
  try{ k = localStorage.getItem(P_GERAET); }catch(e){}
  if(!k){
    k = "g" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    try{ localStorage.setItem(P_GERAET, k); }catch(e){}
  }
  return k;
}

/* =====================================================================
   Pfadzugriff — "kopf.f_datum" oder "punkte.A-M.bild"
   Die Punkt-Kennungen enthalten Bindestriche, aber nie Punkte; deshalb ist
   der Punkt als Trennzeichen eindeutig.
   ===================================================================== */
function ausPfad(obj, pfad){
  const teile = pfad.split(".");
  let o = obj;
  for(let i = 0; i < teile.length; i++){
    if(o === null || o === undefined || typeof o !== "object") return undefined;
    o = o[teile[i]];
  }
  return o;
}

function inPfad(obj, pfad, wert){
  const teile = pfad.split(".");
  let o = obj;
  for(let i = 0; i < teile.length - 1; i++){
    if(o[teile[i]] === undefined || o[teile[i]] === null || typeof o[teile[i]] !== "object"){
      o[teile[i]] = {};
    }
    o = o[teile[i]];
  }
  o[teile[teile.length - 1]] = wert;
}

/* ---------- Die EINZIGE Schreibfunktion ----------
   Alles, was den Datensatz ändert, läuft hier durch. Nur so bekommt jedes
   Feld seinen Zeitstempel, und nur mit Zeitstempel kann zusammengeführt
   statt überschrieben werden. */
function setzen(pfad, wert, sofort){
  inPfad(D, pfad, wert);
  D.t[pfad] = Date.now();
  speichern(sofort);
}

/* Mehrere Felder auf einmal — z. B. wenn eine Maske gespeichert wird. */
function setzenMehrere(paare, sofort){
  const jetzt = Date.now();
  Object.keys(paare).forEach(pfad => {
    inPfad(D, pfad, paare[pfad]);
    D.t[pfad] = jetzt;
  });
  speichern(sofort);
}

/* =====================================================================
   ZUSAMMENFÜHREN

   Kern der Fassung 3. Nimmt zwei Stände derselben Fläche und baut daraus
   einen, der nichts verliert:
     · Feld für Feld gewinnt der jüngere Zeitstempel.
     · Was nur einer der beiden kennt, wird übernommen.
     · Listen (Oberstand, Artenlisten) werden VEREINIGT, nicht ersetzt —
       über die Kennung des einzelnen Eintrags.
     · Ein echter Konflikt (beide haben dasselbe Feld verschieden gefüllt,
       keiner ist klar jünger) wird GEMELDET, nicht still entschieden.

   Der Bericht, den die Funktion zurückgibt, ist kein Beiwerk: Er ist der
   Beleg dafür, was beim Einlesen tatsächlich passiert ist.
   ===================================================================== */
function zusammenfuehren(ziel, quelle){
  const bericht = { neu:0, erneuert:0, behalten:0, listen:0, konflikte:[] };
  if(!quelle || typeof quelle !== "object") return bericht;

  const tq = quelle.t || {};
  const tz = ziel.t   || {};

  Object.keys(tq).forEach(pfad => {
    if(pfad.indexOf("oberstand") === 0) return;        // Listen unten gesondert
    const wertQ = ausPfad(quelle, pfad);
    if(wertQ === undefined) return;
    const sQ = tq[pfad] || 0;
    const sZ = tz[pfad] || 0;
    const wertZ = ausPfad(ziel, pfad);

    if(wertZ === undefined || sQ > sZ){
      // Die Quelle ist jünger oder das Feld ist hier unbekannt.
      if(wertZ !== undefined && String(wertZ) !== String(wertQ) && sZ > 0){
        bericht.konflikte.push({pfad:pfad, hier:wertZ, dort:wertQ, gewinner:"dort"});
      }
      inPfad(ziel, pfad, wertQ);
      ziel.t[pfad] = sQ;
      if(wertZ === undefined) bericht.neu++; else bericht.erneuert++;
    }else if(sZ > sQ){
      if(String(wertZ) !== String(wertQ)){
        bericht.konflikte.push({pfad:pfad, hier:wertZ, dort:wertQ, gewinner:"hier"});
      }
      bericht.behalten++;
    }
  });

  // --- Listen vereinigen ---
  bericht.listen += listeVereinigen(ziel, quelle, "oberstand");

  // Artenlisten der Vegetation liegen je Punkt
  const vq = (quelle.veg && quelle.veg.punkte) || {};
  Object.keys(vq).forEach(pid => {
    if(!ziel.veg) ziel.veg = {punkte:{}, radien:{}};
    if(!ziel.veg.punkte) ziel.veg.punkte = {};
    if(!ziel.veg.punkte[pid]) ziel.veg.punkte[pid] = {einfach:{}, arten:[], bem:"", aufnehmer:""};
    const zp = ziel.veg.punkte[pid], qp = vq[pid] || {};
    if(Array.isArray(qp.arten)){
      const vorher = (zp.arten || []).length;
      zp.arten = eintraegeVereinigen(zp.arten || [], qp.arten);
      bericht.listen += Math.max(0, zp.arten.length - vorher);
    }
  });

  ziel.geaendert = new Date().toISOString();
  return bericht;
}

/* Eine Liste im Datensatz vereinigen (Oberstand). */
function listeVereinigen(ziel, quelle, name){
  const q = Array.isArray(quelle[name]) ? quelle[name] : [];
  if(!Array.isArray(ziel[name])) ziel[name] = [];
  const vorher = ziel[name].length;
  ziel[name] = eintraegeVereinigen(ziel[name], q);
  return Math.max(0, ziel[name].length - vorher);
}

/* Zwei Listen von Einträgen vereinigen. Jeder Eintrag trägt eine Kennung _id
   und einen Zeitstempel _t. Gleiche Kennung → der jüngere gewinnt.
   Einträge OHNE Kennung (aus älteren Fassungen) bekommen eine, abgeleitet aus
   ihrem Inhalt — damit derselbe Baum nicht zweimal in der Liste landet. */
function eintraegeVereinigen(a, b){
  const nach = {};
  const aufnehmen = eintrag => {
    if(!eintrag || typeof eintrag !== "object") return;
    const id = eintrag._id || inhaltsKennung(eintrag);
    if(!eintrag._id) eintrag._id = id;
    const alt = nach[id];
    if(!alt || (eintrag._t || 0) > (alt._t || 0)) nach[id] = eintrag;
  };
  a.forEach(aufnehmen);
  b.forEach(aufnehmen);
  return Object.keys(nach).map(k => nach[k]);
}

/* Kennung aus dem Inhalt — für Einträge, die vor Fassung 3 angelegt wurden. */
function inhaltsKennung(o){
  const roh = JSON.stringify(o, Object.keys(o).filter(k => k[0] !== "_").sort());
  let h = 0;
  for(let i = 0; i < roh.length; i++){ h = ((h << 5) - h + roh.charCodeAt(i)) | 0; }
  return "a" + Math.abs(h).toString(36);
}

/* Neuer Listeneintrag mit Kennung und Stempel. */
function neuerEintrag(felder){
  return Object.assign({
    _id: GERAET + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    _t:  Date.now(),
    _g:  GERAET
  }, felder || {});
}

function eintragAendern(eintrag, felder){
  Object.assign(eintrag, felder);
  eintrag._t = Date.now();
  eintrag._g = GERAET;
  return eintrag;
}

/* =====================================================================
   Flächenverwaltung
   ===================================================================== */
function flaechenListe(){
  try{
    const roh = localStorage.getItem(P_LISTE);
    const l = roh ? JSON.parse(roh) : [];
    return Array.isArray(l) ? l : [];
  }catch(e){ return []; }
}

function flaechenListeSchreiben(l){
  try{ localStorage.setItem(P_LISTE, JSON.stringify(l)); }catch(e){}
}

/* Den Übersichtseintrag einer Fläche auffrischen — Name, Datum, Fortschritt. */
function listeAuffrischen(){
  if(!D.id) return;
  const l = flaechenListe();
  const fertig = PUNKTE.filter(p => punktFertig(p.id)).length;
  const eintrag = {
    id: D.id,
    flaeche: wertVon("kopf","f_flaeche") || "ohne Namen",
    datum: D.kopf.f_datum || "",
    geaendert: D.geaendert || new Date().toISOString(),
    punkte: fertig,
    baeume: (D.oberstand || []).length
  };
  const i = l.findIndex(e => e.id === D.id);
  if(i >= 0) l[i] = eintrag; else l.push(eintrag);
  flaechenListeSchreiben(l);
}

function flaecheAnlegen(name){
  const id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const neu = leererDatensatz();
  neu.id = id;
  neu.kopf.f_datum = new Date().toISOString().slice(0,10);
  neu.t["kopf.f_datum"] = Date.now();
  if(name){
    neu.kopf.f_flaeche = name;
    neu.t["kopf.f_flaeche"] = Date.now();
  }
  const aufnehmer = geraeteName();
  if(aufnehmer){
    neu.kopf.f_team = aufnehmer;
    neu.t["kopf.f_team"] = Date.now();
  }
  D = neu;
  flaecheSchreiben();
  aktuelleMerken(id);
  listeAuffrischen();
  return id;
}

function flaecheSchreiben(){
  if(!D.id || !SPEICHER_OK) return false;
  try{
    localStorage.setItem(P_FLAECHE + D.id, JSON.stringify(D));
    return true;
  }catch(e){
    SPEICHER_OK = false;
    return false;
  }
}

function flaecheLesen(id){
  try{
    const roh = localStorage.getItem(P_FLAECHE + id);
    if(!roh) return null;
    const d = Object.assign(leererDatensatz(), JSON.parse(roh));
    d.id = id;
    return d;
  }catch(e){ return null; }
}

function aktuelleMerken(id){
  try{ localStorage.setItem(P_AKTUELL, id || ""); }catch(e){}
}

function flaecheOeffnen(id){
  const d = flaecheLesen(id);
  if(!d) return false;
  D = d;
  ergaenzen();
  aktuelleMerken(id);
  SEIT_SICHERUNG = 0;
  return true;
}

function flaecheLoeschen(id){
  try{ localStorage.removeItem(P_FLAECHE + id); }catch(e){}
  flaechenListeSchreiben(flaechenListe().filter(e => e.id !== id));
  if(D.id === id){ D = leererDatensatz(); aktuelleMerken(""); }
}

/* Einen fremden Stand einsortieren: gehört er zu einer Fläche, die es hier
   schon gibt, wird zusammengeführt — sonst als neue Fläche angelegt.
   Zugeordnet wird über die Kennung; hilfsweise über Flächenname und Datum,
   damit auch Sicherungen aus Fassung 2 (die keine Kennung haben) landen,
   wo sie hingehören. */
function standEinsortieren(fremd){
  const l = flaechenListe();
  let zielId = null;

  if(fremd.id && l.some(e => e.id === fremd.id)){
    zielId = fremd.id;
  }else{
    const name  = (fremd.kopf && fremd.kopf.f_flaeche) || "";
    const datum = (fremd.kopf && fremd.kopf.f_datum) || "";
    const treffer = l.find(e => e.flaeche === name && e.datum === datum && name);
    if(treffer) zielId = treffer.id;
  }

  if(zielId){
    const war = (D.id === zielId) ? D : flaecheLesen(zielId);
    const bericht = zusammenfuehren(war, fremd);
    if(D.id === zielId){ D = war; }
    else{
      const merk = D;
      D = war; flaecheSchreiben(); D = merk;
    }
    // Übersicht des Ziels auffrischen
    const merk2 = D; D = war; listeAuffrischen(); D = merk2;
    return {art:"zusammengefuehrt", id:zielId, bericht:bericht};
  }

  // Neue Fläche
  const neu = Object.assign(leererDatensatz(), fremd);
  neu.id = fremd.id || ("f" + Date.now().toString(36) + Math.random().toString(36).slice(2,6));
  neu.fassung = 3;
  const merk = D;
  D = neu; ergaenzen(); flaecheSchreiben(); listeAuffrischen(); D = merk;
  return {art:"neu", id:neu.id, bericht:{neu:Object.keys(neu.t||{}).length, erneuert:0, behalten:0, listen:(neu.oberstand||[]).length, konflikte:[]}};
}

/* =====================================================================
   Speichern
   ===================================================================== */
let SPEICHER_TIMER = null;

function speicherPruefen(){
  try{
    localStorage.setItem("_wta_test","1");
    localStorage.removeItem("_wta_test");
    SPEICHER_OK = true;
  }catch(e){ SPEICHER_OK = false; }
  return SPEICHER_OK;
}

function speichern(sofort){
  D.geaendert = new Date().toISOString();
  D.herkunft[GERAET] = D.geaendert;
  SEIT_SICHERUNG++;
  kopfAktualisieren();
  erinnerungPruefen();
  if(document.getElementById("daten") && document.getElementById("daten").classList.contains("aktiv")){
    exporteAufbauen();
  }
  if(!SPEICHER_OK){ statusZeigen("KEIN SPEICHER — regelmäßig sichern!", true); return; }
  if(SPEICHER_TIMER) clearTimeout(SPEICHER_TIMER);
  if(sofort){ wirklichSpeichern(); return; }
  SPEICHER_TIMER = setTimeout(wirklichSpeichern, 250);
}

function wirklichSpeichern(){
  SPEICHER_TIMER = null;
  const t0 = performance.now();
  const ok = flaecheSchreiben();
  if(ok){
    listeAuffrischen();
    LETZTE_SPEICHERDAUER = performance.now() - t0;
    statusZeigen("gespeichert " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})
      + " · " + LETZTE_SPEICHERDAUER.toFixed(0) + " ms");
    if(typeof syncAnstossen === "function") syncAnstossen();
  }else{
    speicherWarnungZeigen();
    statusZeigen("Speichern fehlgeschlagen", true);
  }
}

/* ---------- Fehlende Zweige nachziehen ---------- */
function ergaenzen(){
  const leer = leererDatensatz();
  Object.keys(leer).forEach(k => { if(D[k] === undefined || D[k] === null) D[k] = leer[k]; });
  if(!D.parzellen) D.parzellen = {A:{},B:{}};
  if(!D.parzellen.A) D.parzellen.A = {};
  if(!D.parzellen.B) D.parzellen.B = {};
  if(!D.schema) D.schema = {};
  if(!D.schema.nummern) D.schema.nummern = {A:{},B:{}};
  if(!D.schema.nummern.A) D.schema.nummern.A = {};
  if(!D.schema.nummern.B) D.schema.nummern.B = {};
  if(!D.veg) D.veg = {};
  if(!D.veg.punkte) D.veg.punkte = {};
  if(!D.veg.radien) D.veg.radien = {};
  if(!D.wta) D.wta = {};
  if(!D.t) D.t = {};
  if(!D.herkunft) D.herkunft = {};
  if(!D.bedingungen) D.bedingungen = {};
  if(!Array.isArray(D.oberstand)) D.oberstand = [];

  D.oberstand.forEach(b => {
    if(b.parzelle === undefined) b.parzelle = "A";
    if(b.azimut   === undefined) b.azimut   = "";
    if(b.dist     === undefined) b.dist     = "";
    if(b.bem      === undefined) b.bem      = "";
    if(b.kontrolle === undefined) b.kontrolle = false;
    if(b.k_dist2  === undefined) b.k_dist2  = "";
    if(b.k_azimut === undefined) b.k_azimut = "";
    if(b._id      === undefined) b._id      = inhaltsKennung(b);
    if(b._t       === undefined) b._t       = 1;
  });
}

/* =====================================================================
   Übernahme aus den Fassungen 1 und 2
   Beim ersten Start der Fassung 3 wird die alte Aufnahme gesucht und als
   erste Fläche angelegt. Nichts wird gelöscht: Der alte Speicherplatz
   bleibt unberührt, damit ein Rückschritt möglich bleibt.
   ===================================================================== */
function altUebernehmen(){
  if(flaechenListe().length) return null;      // schon Flächen da — nichts zu tun
  let alt = null, ausFassung = 0;
  try{
    const r2 = localStorage.getItem(SCHLUESSEL_V2);
    if(r2){ alt = JSON.parse(r2); ausFassung = 2; }
    else{
      const r1 = localStorage.getItem(SCHLUESSEL_V1);
      if(r1){ alt = JSON.parse(r1); ausFassung = 1; }
    }
  }catch(e){ return null; }
  if(!alt) return null;

  const neu = ausFassung2(alt);
  neu.id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  D = neu;
  flaecheSchreiben();
  aktuelleMerken(neu.id);
  listeAuffrischen();
  return {fassung: ausFassung, flaeche: (neu.kopf.f_flaeche || "ohne Namen"),
          punkte: Object.keys(neu.punkte || {}).length};
}

/* Einen Datensatz der Fassung 1 oder 2 in die Fassung 3 überführen.

   Drei Dinge ändern sich inhaltlich, und alle drei werden hier vollzogen,
   damit keine Altaufnahme still falsch weiterläuft:
   (1) Je Parzelle gab es Breite außen UND innen; jetzt gibt es eine Breite.
       Übernommen wird die AUSSENBREITE — sie ist die gemessene; die
       Innenbreite war auf BY07 ohnehin geschätzt.
   (2) Der Trennstreifen hatte nur ein Maß. Es wandert auf die Länge
       (Abstand zwischen den Parzellen); die Breite bleibt leer.
   (3) Die Ko-Registrierung (Passpunktbäume, Klammer) entfällt. Was dort
       stand, geht NICHT verloren, sondern wird an die Bemerkung angehängt. */
function ausFassung2(alt){
  const n = leererDatensatz();
  if(!alt || typeof alt !== "object") return n;
  const stempel = alt.geaendert ? new Date(alt.geaendert).getTime() : Date.now();

  const uebernehmen = (quelle, praefix) => {
    if(!quelle || typeof quelle !== "object") return;
    Object.keys(quelle).forEach(k => {
      const wert = quelle[k];
      if(wert === undefined || wert === null || wert === "") return;
      inPfad(n, praefix + "." + k, wert);
      n.t[praefix + "." + k] = stempel;
    });
  };

  uebernehmen(alt.kopf, "kopf");
  uebernehmen(alt.bestand, "bestand");
  uebernehmen(alt.wta, "wta");
  uebernehmen(alt.schema, "schema");
  if(alt.schema && alt.schema.nummern) n.schema.nummern = alt.schema.nummern;

  // Parzellen: Außenbreite wird die Breite
  if(alt.parzellen){
    ["A","B"].forEach(pz => {
      const p = alt.parzellen[pz] || {};
      const vor = (pz === "A") ? "pa_" : "pb_";
      const ziel = "parzellen." + pz + ".";
      [["code","code"],["herkunft","herkunft"],["lage","lage"],["lage_frei","lage_frei"],
       ["laenge","laenge"]].forEach(([von,nach]) => {
        if(p[vor+von] !== undefined && p[vor+von] !== ""){
          inPfad(n, ziel + vor + nach, p[vor+von]);
          n.t[ziel + vor + nach] = stempel;
        }
      });
      if(p[vor+"breite_a"] !== undefined && p[vor+"breite_a"] !== ""){
        inPfad(n, ziel + vor + "breite", p[vor+"breite_a"]);
        n.t[ziel + vor + "breite"] = stempel;
      }
    });
  }

  // Trennstreifen: das alte Einzelmaß ist die Länge (Abstand der Parzellen)
  if(alt.kopf && alt.kopf.f_trenn){
    inPfad(n, "kopf.f_trenn_l", alt.kopf.f_trenn);
    n.t["kopf.f_trenn_l"] = stempel;
  }

  // Messpunkte einschließlich aller Werte
  const ap = alt.punkte || {};
  Object.keys(ap).forEach(pid => {
    const p = ap[pid] || {};
    Object.keys(p).forEach(k => {
      if(p[k] === undefined || p[k] === null || p[k] === "") return;
      inPfad(n, "punkte." + pid + "." + k, p[k]);
      n.t["punkte." + pid + "." + k] = stempel;
    });
  });

  // Vegetation
  if(alt.veg){
    n.veg.radien = alt.veg.radien || {};
    const av = alt.veg.punkte || {};
    Object.keys(av).forEach(pid => {
      const v = av[pid] || {};
      n.veg.punkte[pid] = {
        einfach: v.einfach || {},
        arten: (Array.isArray(v.arten) ? v.arten : []).map(a =>
          Object.assign({_id: inhaltsKennung(a), _t: stempel}, a)),
        kronenschluss: v.kronenschluss || "",
        bem: v.bem || "",
        aufnehmer: v.aufnehmer || ""
      };
      Object.keys(n.veg.punkte[pid].einfach).forEach(k => {
        n.t["veg.punkte." + pid + ".einfach." + k] = stempel;
      });
      ["kronenschluss","bem","aufnehmer"].forEach(k => {
        if(n.veg.punkte[pid][k]) n.t["veg.punkte." + pid + "." + k] = stempel;
      });
    });
  }

  // Oberstand
  n.oberstand = (Array.isArray(alt.oberstand) ? alt.oberstand : []).map(b =>
    Object.assign({_id: inhaltsKennung(b), _t: stempel, _g: "alt"}, b));

  // Messbedingungen aus dem alten Geländeabschnitt
  if(alt.gelaende){
    ["g_himmel1","g_himmel2","g_himmel3","g_ok1","g_ok2","g_ok3","g_abfahrt"].forEach(k => {
      if(alt.gelaende[k] !== undefined && alt.gelaende[k] !== ""){
        inPfad(n, "bedingungen." + k, alt.gelaende[k]);
        n.t["bedingungen." + k] = stempel;
      }
    });
  }

  // Was entfällt, wird angehängt statt weggeworfen
  const reste = [];
  if(alt.gelaende){
    const g = alt.gelaende;
    if(g.g_neigung)  reste.push("Hangneigung im Feld geschätzt: " + g.g_neigung + "°");
    if(g.g_horizont) reste.push("Horizontüberhöhung: " + g.g_horizont);
    if(g.g_exposition) reste.push("Exposition: " + g.g_exposition);
    if(g.g_relief)   reste.push("Relief: " + g.g_relief);
  }
  if(alt.koreg){
    const k = alt.koreg;
    if(k.k_azimut_ab || k.k_dist_ab)
      reste.push("Klammer A→B: " + (k.k_azimut_ab||"—") + "° / " + (k.k_dist_ab||"—") + " m");
    if(k.k_nordbezug)  reste.push("Nordbezug: " + k.k_nordbezug);
    if(k.k_gegenkurs)  reste.push("Gegenkurs-Test: " + k.k_gegenkurs);
    if(k.k_geraet)     reste.push("Azimutgerät: " + k.k_geraet);
  }
  if(Array.isArray(alt.baeume) && alt.baeume.length){
    reste.push("Passpunktbäume der alten Fassung (" + alt.baeume.length + "): "
      + alt.baeume.map(b => (b.nr||"?") + " " + (b.azimut||"?") + "°/" + (b.dist||"?") + "m").join(" · "));
  }
  if(reste.length){
    const bisher = n.kopf.f_bemerkung ? n.kopf.f_bemerkung + "\n\n" : "";
    n.kopf.f_bemerkung = bisher
      + "--- Aus der Fassung 2 übernommen (Abschnitte entfallen in Fassung 3) ---\n"
      + reste.join("\n");
    n.t["kopf.f_bemerkung"] = Date.now();
  }

  n.fassung = 3;
  n.geaendert = alt.geaendert || new Date().toISOString();
  n.aus_fassung2 = true;
  return n;
}

/* =====================================================================
   Zielobjekte und Zielpfade der Formularfelder

   Die Masken nennen ihr Ziel weiterhin kurz ("kopf", "parzA"). Fassung 3
   braucht zusätzlich den PFAD, weil jedes Feld seinen Zeitstempel unter
   diesem Pfad ablegt. Beides steht hier nebeneinander, damit es nicht
   auseinanderlaufen kann.
   ===================================================================== */
function zielObjekt(name){
  switch(name){
    case "kopf":        return D.kopf;
    case "bestand":     return D.bestand;
    case "bedingungen": return D.bedingungen;
    case "schema":      return D.schema;
    case "wta":         return D.wta;
    case "parzA":       return D.parzellen.A;
    case "parzB":       return D.parzellen.B;
    default:            return D.kopf;
  }
}

function zielPfad(name){
  switch(name){
    case "parzA": return "parzellen.A";
    case "parzB": return "parzellen.B";
    case "kopf": case "bestand": case "bedingungen": case "schema": case "wta":
      return name;
    default: return "kopf";
  }
}
