/* =====================================================================

const SCHLUESSEL = "wta_feld_v2";
const SCHLUESSEL_ALT = "wta_feld_v1";

function leererDatensatz(){
  return {
    fassung: 2,
    kopf:{}, bestand:{}, gelaende:{}, koreg:{}, schema:{nummern:{A:{},B:{}}},
    parzellen:{ A:{}, B:{} },

  };
}

let SPEICHER_OK = null;      // wird beim Start geprüft
let SEIT_SICHERUNG = 0;      // Änderungen seit der letzten Sicherung
let LETZTE_SPEICHERDAUER = null;

/* --- Zielobjekte der Formularfelder --- */
function zielObjekt(name){
  switch(name){
    case "kopf":     return D.kopf;
    case "bestand":  return D.bestand;
    case "gelaende": return D.gelaende;
    case "koreg":    return D.koreg;
    case "schema":   return D.schema;
    case "wta":      return D.wta;
    case "parzA":    return D.parzellen.A;
    case "parzB":    return D.parzellen.B;
    default:         return D.kopf;
  }
}

function speicherPruefen(){
  try{
    localStorage.setItem("_wta_test","1");
    localStorage.removeItem("_wta_test");
    SPEICHER_OK = true;
  }catch(e){ SPEICHER_OK = false; }
  return SPEICHER_OK;
}

/* ---------- Speichern, entkoppelt ----------
   Fassung 1 schrieb bei JEDER Eingabe den ganzen Datensatz weg UND baute beide
   Exporttexte neu auf. Das wurde mit wachsender Aufnahme spürbar langsamer — genau
   der Effekt, der am Feldtag aufgefallen ist. Jetzt:
     · der Schreibvorgang wird gebündelt (250 ms nach der letzten Eingabe),
     · der Export wird nur noch gebaut, wenn der Abschnitt "Daten" offen ist. */
let SPEICHER_TIMER = null;

function speichern(sofort){
  D.geaendert = new Date().toISOString();
  SEIT_SICHERUNG++;
  kopfAktualisieren();
  erinnerungPruefen();
  if(document.getElementById("daten").classList.contains("aktiv")) exporteAufbauen();
  if(!SPEICHER_OK){ statusZeigen("KEIN SPEICHER — regelmäßig sichern!", true); return; }
  if(SPEICHER_TIMER) clearTimeout(SPEICHER_TIMER);
  if(sofort){ wirklichSpeichern(); return; }
  SPEICHER_TIMER = setTimeout(wirklichSpeichern, 250);
}

function wirklichSpeichern(){
  SPEICHER_TIMER = null;
  const t0 = performance.now();
  try{
    localStorage.setItem(SCHLUESSEL, JSON.stringify(D));
    LETZTE_SPEICHERDAUER = performance.now() - t0;
    statusZeigen("gespeichert " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})
      + " · " + LETZTE_SPEICHERDAUER.toFixed(0) + " ms");
  }catch(e){
    SPEICHER_OK = false;
    speicherWarnungZeigen();
    statusZeigen("Speichern fehlgeschlagen: " + (e && e.name ? e.name : "unbekannt"), true);
  }
}

function laden(){
  if(!SPEICHER_OK) return;
  try{
    const roh = localStorage.getItem(SCHLUESSEL);
    if(roh){ D = Object.assign(leererDatensatz(), JSON.parse(roh)); ergaenzen(); return; }
    // Kein Datensatz der neuen Fassung — dann nach der alten sehen und umsetzen.
    const alt = localStorage.getItem(SCHLUESSEL_ALT);
    if(alt){ D = migrieren(JSON.parse(alt)); wirklichSpeichern(); }
  }catch(e){ /* leerer Start */ }
}

/* Fehlende Zweige nachziehen — eine ältere Sicherung kennt sie noch nicht. */
function ergaenzen(){
  const leer = leererDatensatz();
  Object.keys(leer).forEach(k => { if(D[k] === undefined || D[k] === null) D[k] = leer[k]; });
  if(!D.parzellen) D.parzellen = {A:{},B:{}};
  if(!D.parzellen.A) D.parzellen.A = {};
  if(!D.parzellen.B) D.parzellen.B = {};
  if(!D.schema) D.schema = {};
  if(!D.schema.nummern) D.schema.nummern = {A:{},B:{}};
  if(!D.schema.nummern.A) D.schema.nummern.A = {};
  if(!D.schema.nummern.B) D.schema.nummern.B = {};
  if(!D.veg) D.veg = {};
  if(!D.veg.punkte) D.veg.punkte = {};
  if(!D.veg.radien) D.veg.radien = {};
  if(!D.wta) D.wta = {};
  if(!Array.isArray(D.baeume)) D.baeume = [];
  if(!Array.isArray(D.oberstand)) D.oberstand = [];
}

/* ---------- Übernahme einer Sicherung der Fassung 1 ----------
   Der Aufbau ist bis auf drei Punkte gleich:
     · Herkunft und Gattermaße lagen im Kopf, jetzt je Parzelle
     · Vegetation hatte einen Modus (entweder/oder), jetzt beides nebeneinander
     · der Freitext der Auswahlfelder ist neu
   Nichts wird verworfen: Was sich nicht zuordnen lässt, landet in der Bemerkung. */
function migrieren(alt){
  const n = leererDatensatz();
  if(!alt || typeof alt !== "object") return n;
  n.kopf      = Object.assign({}, alt.kopf || {});
  n.bestand   = Object.assign({}, alt.bestand || {});
  n.gelaende  = Object.assign({}, alt.gelaende || {});
  n.koreg     = Object.assign({}, alt.koreg || {});
  n.punkte    = Object.assign({}, alt.punkte || {});
  n.baeume    = Array.isArray(alt.baeume) ? alt.baeume.slice() : [];
  n.oberstand = Array.isArray(alt.oberstand) ? alt.oberstand.slice() : [];
  n.wta       = Object.assign({}, alt.wta || {});

  n.parzellen.A.herkunft = (alt.kopf && alt.kopf.f_herkunft_a) || "";
  n.parzellen.B.herkunft = (alt.kopf && alt.kopf.f_herkunft_b) || "";
  if(alt.kopf && alt.kopf.f_laenge_m){ n.parzellen.A.pa_laenge = alt.kopf.f_laenge_m; }
  if(alt.kopf && alt.kopf.f_breite_m){ n.parzellen.A.pa_breite_a = alt.kopf.f_breite_m; }
  delete n.kopf.f_herkunft_a; delete n.kopf.f_herkunft_b;
  delete n.kopf.f_laenge_m;   delete n.kopf.f_breite_m;

  n.veg.punkte = {};
  const altVeg = (alt.veg && alt.veg.punkte) || {};
  Object.keys(altVeg).forEach(pid => {
    const v = altVeg[pid] || {};
    n.veg.punkte[pid] = {
      einfach: v.einfach || {},
      arten:   Array.isArray(v.arten) ? v.arten : [],
      kronenschluss: v.kronenschluss || "",
      bem: v.bem || "",
      aufnehmer: ""
    };
  });
  n.veg.radien = {};
  n.fassung = 2;
  n.geaendert = alt.geaendert || new Date().toISOString();
  n.umgesetzt_aus_fassung1 = true;
  return n;
}
